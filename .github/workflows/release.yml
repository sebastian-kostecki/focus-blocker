name: Release

# Push a tag like v1.0.0 to publish a release with a ready-to-install ZIP.
# For a tag that already exists, run this workflow manually from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Build ZIP
        run: git archive --format=zip --prefix=FocusBlocker/ -o "FocusBlocker-${TAG}.zip" HEAD

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" "FocusBlocker-${TAG}.zip" \
            --title "FocusBlocker ${TAG}" \
            --generate-notes
